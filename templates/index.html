```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iris Flower Prediction</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 500px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #555;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #333;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #555;
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            text-align: center;
            background: #eef6ee;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
        }

        .error {
            margin-top: 20px;
            padding: 12px;
            text-align: center;
            background: #ffecec;
            color: #c00;
            border-radius: 6px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Iris Flower Prediction</h1>

        <p class="description">
            Enter the flower measurements to predict its species using
            Logistic Regression.
        </p>

        <form action="/predict" method="POST">

            <label for="sepal_length">Sepal Length</label>
            <input
                type="number"
                step="any"
                name="sepal_length"
                id="sepal_length"
                placeholder="Enter sepal length"
                required
            >

            <label for="sepal_width">Sepal Width</label>
            <input
                type="number"
                step="any"
                name="sepal_width"
                id="sepal_width"
                placeholder="Enter sepal width"
                required
            >

            <label for="petal_length">Petal Length</label>
            <input
                type="number"
                step="any"
                name="petal_length"
                id="petal_length"
                placeholder="Enter petal length"
                required
            >

            <label for="petal_width">Petal Width</label>
            <input
                type="number"
                step="any"
                name="petal_width"
                id="petal_width"
                placeholder="Enter petal width"
                required
            >

            <button type="submit">Predict</button>

        </form>

        {% if prediction %}
            <div class="result">
                Predicted Species: {{ prediction }}
            </div>
        {% endif %}

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

    </div>

</body>
</html>
```
